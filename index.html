<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotería de las tablas</title>
  <meta name="description" content="Repasa las tablas de multiplicar del 2 al 9 con cartas de lotería.">
  <meta name="theme-color" content="#00A19A">
  <link rel="icon" href="assets/img/8.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&family=Bungee+Shade&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <svg class="papel-picado" aria-hidden="true"></svg>
    <h1 class="titulo">Lotería de las tablas</h1>
  </header>

  <main class="tablero" aria-live="polite">
    <div class="mesa">
      <article class="carta carta-factor" data-pos="a">
        <div class="carta-giro">
          <div class="cara cara-frente">
            <span class="esquina">?</span>
            <img class="ilustracion" alt="">
            <span class="nombre"></span>
          </div>
          <div class="cara cara-reverso" style="--reverso: url('assets/img/reverso.webp')"></div>
        </div>
      </article>

      <span class="signo signo-por" aria-hidden="true">×</span>

      <article class="carta carta-factor" data-pos="b">
        <div class="carta-giro">
          <div class="cara cara-frente">
            <span class="esquina">?</span>
            <img class="ilustracion" alt="">
            <span class="nombre"></span>
          </div>
          <div class="cara cara-reverso" style="--reverso: url('assets/img/reverso.webp')"></div>
        </div>
      </article>

      <span class="signo signo-igual" aria-hidden="true">=</span>

      <article class="carta carta-resultado">
        <div class="carta-giro">
          <div class="cara cara-frente">
            <span class="producto"></span>
            <span class="nombre nombre-cuenta"></span>
          </div>
          <div class="cara cara-reverso" style="--reverso: url('assets/img/reverso.webp')">
            <div class="medallon" hidden>
              <svg class="anillo" viewBox="0 0 100 100" aria-hidden="true">
                <circle class="anillo-fondo" cx="50" cy="50" r="44"></circle>
                <circle class="anillo-avance" cx="50" cy="50" r="44" pathLength="1"></circle>
              </svg>
              <span class="segundos"></span>
            </div>
          </div>
        </div>
      </article>
    </div>

    <p class="leyenda" id="leyenda">Saca una carta y di el resultado antes de que se acabe el tiempo.</p>

    <button class="boton-principal" id="boton-principal" type="button" aria-describedby="leyenda">
      Sacar cuenta
    </button>
    <p class="atajo">También puedes usar la barra espaciadora.</p>
  </main>

  <footer class="barra">
    <button class="boton-discreto" id="boton-ajustes" type="button" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.6 4.9-1.9-.4a6.9 6.9 0 0 1-.6 1.5l1.1 1.6-1.6 1.6-1.6-1.1c-.5.3-1 .5-1.5.6l-.4 1.9h-2.2l-.4-1.9a6.9 6.9 0 0 1-1.5-.6l-1.6 1.1-1.6-1.6 1.1-1.6c-.3-.5-.5-1-.6-1.5l-1.9-.4v-2.2l1.9-.4c.1-.5.3-1 .6-1.5L4.8 7.1l1.6-1.6L8 6.6c.5-.3 1-.5 1.5-.6l.4-1.9h2.2l.4 1.9c.5.1 1 .3 1.5.6l1.6-1.1 1.6 1.6-1.1 1.6c.3.5.5 1 .6 1.5l1.9.4v2.2Z"/></svg>
    </button>
    <span class="dato" id="baraja-info"></span>
    <span class="dato" id="racha-info"></span>
    <button class="boton-discreto boton-estudio" id="boton-estudio" type="button" aria-pressed="false">
      <span class="estudio-icono" aria-hidden="true"></span>
      <span class="estudio-texto" id="estudio-texto">Empezar estudio</span>
      <span class="estudio-barra" aria-hidden="true"><span id="estudio-avance"></span></span>
    </button>
  </footer>

  <dialog class="dialogo" id="dialogo-ajustes" aria-labelledby="ajustes-titulo">
    <form method="dialog" id="form-ajustes">
      <h2 id="ajustes-titulo">Ajustes</h2>

      <label class="campo">
        <span>Segundos para contestar</span>
        <input type="number" name="segundos" min="2" max="30" step="1" required>
      </label>

      <label class="campo">
        <span>Minutos de estudio al día</span>
        <input type="number" name="minutos" min="1" max="120" step="1" required>
      </label>

      <fieldset class="campo tablas">
        <legend>Tablas que quieres repasar</legend>
        <div class="tablas-opciones" id="tablas-opciones"></div>
        <p class="error" id="error-tablas" hidden>Elige al menos una tabla.</p>
      </fieldset>

      <div class="interruptores">
        <label><input type="checkbox" name="voz"> Voz que lee las cuentas</label>
        <label><input type="checkbox" name="sonido"> Sonidos</label>
      </div>

      <div class="acciones">
        <button type="button" class="boton-secundario" value="cancelar" id="ajustes-cancelar">Cancelar</button>
        <button type="submit" class="boton-guardar" value="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialogo dialogo-victoria" id="dialogo-victoria" aria-labelledby="victoria-titulo">
    <img src="assets/img/victoria.webp" alt="" class="victoria-ilustracion">
    <h2 id="victoria-titulo">¡Lotería!</h2>
    <p id="victoria-texto">Terminaste tu estudio de hoy.</p>
    <form method="dialog"><button class="boton-guardar" autofocus>Cerrar</button></form>
    <!-- Dentro del diálogo para que las serpentinas queden por encima del fondo oscuro. -->
    <canvas class="serpentinas" id="serpentinas" aria-hidden="true"></canvas>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
